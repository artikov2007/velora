[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velora-api"
version = "0.1.0"
description = "Regional multi-vendor marketplace API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]