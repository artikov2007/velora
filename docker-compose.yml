services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: velora
      POSTGRES_USER: velora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - velora-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velora -d velora"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      VELORA_DATABASE_URL: postgresql+psycopg://velora:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/velora
      VELORA_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    command: sh -c "alembic upgrade head && python -m app.modules.catalog.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  velora-postgres: